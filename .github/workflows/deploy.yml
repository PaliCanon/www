# The deploy of the showcase. Nothing here deploys a Worker: there is no dev
# environment (task 015) and prod is the container, not a Worker (task 014).
# A v* tag builds the image (job `image`, task 013), and the image is deployed
# by digest in Lsh0x/lsh-tech, stacks/palicanon/prod, on ssh.lsh.tech behind
# the lsh-tech tunnel. A push to main, and a run by hand on a branch, start
# the workflow and run no job. Nothing here checks palicanon.app, since the
# server is updated after this workflow: run
# `scripts/deploy-check.sh https://palicanon.app index` by hand after that
# deploy (`index`: no noindex, and the old site's URLs redirect to the search).
# The full history is fetched (fetch-depth: 0): a page's lastmod is the date
# of the last commit of its file.
name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The image of the showcase for ssh.lsh.tech (Dockerfile, task 013), on a
  # tag only, pushed to GHCR (task 016): ghcr.io/palicanon/www. The stack
  # (Lsh0x/lsh-tech) runs it by the digest this job prints in its summary.
  # Content-addressed as learn-pali's: the h- tag is a hash of the tracked
  # inputs' blob ids (not the docs, the task files, the workflows or infra/,
  # which do not shape the image), built only when that tag is missing on
  # GHCR, so a release whose sources did not change reuses the image and only
  # gets the release tag. The release is the container's environment
  # (WWW_ENV, WWW_SHA), not a build argument. The build runs the build and
  # test:dist (SITE_URL https://palicanon.app, in the Dockerfile), with the
  # full history in the context (lastmod). The source label links the package
  # to this repository, so later pushes of the workflow token keep working.
  # No cloud account, no repository variable: the workflow token is enough.
  image:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # persist-credentials: false: the context holds .git, and a persisted
      # token would sit in .git/config, readable there.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3

      - name: Compute the input hash and image refs
        id: vars
        run: |
          set -euo pipefail
          HASH=$(git ls-files -s -- . ':(exclude).github' ':(exclude).task' ':(exclude)infra' ':(exclude)*.md' | sha256sum | cut -c1-16)
          IMAGE="ghcr.io/palicanon/www"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "image_hash=$IMAGE:h-$HASH" >> "$GITHUB_OUTPUT"
          echo "www: input hash h-$HASH"

      - name: Check whether that image already exists
        id: check-image
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${{ steps.vars.outputs.image_hash }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "www: ${{ steps.vars.outputs.image_hash }} already built, skipped"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        if: steps.check-image.outputs.exists != 'true'
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image_hash }}
            ${{ steps.vars.outputs.image }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Put the release tag on the image that already exists
        if: steps.check-image.outputs.exists == 'true'
        run: docker buildx imagetools create --tag "${{ steps.vars.outputs.image }}:${{ github.ref_name }}" "${{ steps.vars.outputs.image_hash }}"

      - name: The image to run
        run: |
          set -euo pipefail
          DIGEST=$(docker buildx imagetools inspect "${{ steps.vars.outputs.image_hash }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          {
            echo "www image ${{ steps.vars.outputs.image }}@$DIGEST"
            echo "tag ${{ steps.vars.outputs.image_hash }} (release ${{ github.ref_name }})"
          } | tee -a "$GITHUB_STEP_SUMMARY"
