# The deploy of the showcase to Cloudflare Workers static assets
# (wrangler.jsonc). A push to main deploys dev (www-dev, served at
# https://dev.palicanon.app, every response noindex), then checks the host.
# A v* tag deploys prod (www-prod, built for https://palicanon.app, served at
# palicanon.app since task 006, indexable), then checks the host the same way
# (`index`: no noindex, and the old site's URLs redirect to the search).
# By hand (workflow_dispatch): a branch deploys dev, a tag prod; `check:
# false` skips dev's host check (prod's always runs), for the first upload,
# before tofu has attached dev.palicanon.app (infra/README.md, "Order").
# The full history is fetched (fetch-depth: 0): a page's lastmod is the date
# of the last commit of its file. test:dist runs with the build's SITE_URL:
# the suite reads the canonical origin from it. The custom domains are tofu's (infra/).
# A v* tag also builds the container image (job `image`, task 013) that
# ssh.lsh.tech will serve in place of the prod Worker.
name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      check:
        description: Check the dev host after the upload
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  dev:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://dev.palicanon.app
      - run: npm run test:dist
        env:
          SITE_URL: https://dev.palicanon.app
      - run: scripts/noindex.sh dist
      - uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.151.0
          command: deploy --env dev
      - if: github.event_name != 'workflow_dispatch' || inputs.check
        run: |
          set +e
          scripts/deploy-check.sh https://dev.palicanon.app noindex
          status=$?
          set -e
          if [ "$status" = 3 ]; then
            echo "::warning::deploy-check: Cloudflare challenged the runner; re-run scripts/deploy-check.sh by hand"
            echo "deploy-check: challenged, re-run by hand" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$status"

  prod:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://palicanon.app
      - run: npm run test:dist
        env:
          SITE_URL: https://palicanon.app
      - uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.151.0
          command: deploy --env prod
      - run: |
          set +e
          scripts/deploy-check.sh https://palicanon.app index
          status=$?
          set -e
          if [ "$status" = 3 ]; then
            echo "::warning::deploy-check: Cloudflare challenged the runner; re-run scripts/deploy-check.sh by hand"
            echo "deploy-check: challenged, re-run by hand" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$status"

  # The image of the showcase for ssh.lsh.tech (Dockerfile, task 013), on a
  # tag only: the stack (Lsh0x/lsh-tech) runs it by the tag this job prints.
  # Content-addressed as learn-pali's: the tag is a hash of the tracked inputs'
  # blob ids (not the docs, the task files, the workflows or infra/, which do
  # not shape the image), built only when that tag is missing, so a release
  # whose sources did not change reuses the image. The release is the
  # container's environment (WWW_ENV, WWW_SHA), not a build argument. The
  # build runs the same build and test:dist as the prod job above, with the
  # full history in the context (lastmod). Needs the repository variables
  # WIF_PROVIDER, DEPLOYER_SA and GCP_PROJECT (README.md, "Container").
  image:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      REGION: europe-west1
    steps:
      # persist-credentials: false: the context holds .git, and a persisted
      # token would sit in .git/config, readable there.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Compute the input hash and image refs
        id: vars
        run: |
          set -euo pipefail
          HASH=$(git ls-files -s -- . ':(exclude).github' ':(exclude).task' ':(exclude)infra' ':(exclude)*.md' ':(exclude)wrangler.jsonc' | sha256sum | cut -c1-16)
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/palicanon/www"
          echo "image_hash=$IMAGE:h-$HASH" >> "$GITHUB_OUTPUT"
          echo "www: input hash h-$HASH"

      - name: Check whether that image already exists
        id: check-image
        run: |
          set -euo pipefail
          if gcloud artifacts docker images describe "${{ steps.vars.outputs.image_hash }}" \
            --project "${{ vars.GCP_PROJECT }}" --quiet >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "www: ${{ steps.vars.outputs.image_hash }} already built, skipped"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.check-image.outputs.exists != 'true'
      - uses: docker/build-push-action@v6
        if: steps.check-image.outputs.exists != 'true'
        with:
          context: .
          push: true
          tags: ${{ steps.vars.outputs.image_hash }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image to run
        run: echo "www image ${{ steps.vars.outputs.image_hash }}" | tee -a "$GITHUB_STEP_SUMMARY"
